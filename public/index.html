function realById(id){
  for(var i=0;i<REAL_COS.length;i++){if(REAL_COS[i].id===id){return REAL_COS[i];}}
  return LIVE_REG[id]||null;
}
/* a company in the same shape the checker works with (GCOS shape) */
function realCoOf(c){
  return {n:c.n,price:c.price,shares:c.shares,bvps:Math.round(c.eq/c.shares*100)/100,sales:c.sales,ca:c.ca,cl:c.cl,ltd:c.ltd,div:c.div,divOpen:!!c.divOpen,divNoData:!!c.divNoData,eps:c.eps.slice(),cur:'$',real:true,live:!!c.live,rid:c.id};
}
function realCo(id){
  var c=realById(id);
  return c?realCoOf(c):null;
}
var REAL_SIZE=400;
function realTests(co){return grahamTests(co,{sizeMin:REAL_SIZE,cur:'$',divLb:true,divOpen:co.divOpen,divNoData:co.divNoData});}

var scoreCache={};
function realScore(id,mode){
  var k=id+mode;
  if(!scoreCache[k]){
    var R=realTests(realCo(id));
    var ts=mode==='def'?R.def:R.ent;
    scoreCache[k]={ok:ts.filter(function(t){return t.ok;}).length,n:ts.length,items:ts.map(function(t){return t.ok;})};
  }
  return scoreCache[k];
}

/* the highest price at which the price tests would pass (null when there is no positive normal earnings) */
function priceCeiling(R,co,mode){
  if(mode==='ent'){return co.bvps>0?1.2*co.bvps:null;}
  if(!(R.a3>0)){return null;}
  var byPe=15*R.a3;
  var byAssets=Math.max(1.5*co.bvps,R.gn||0);
  var c=Math.min(byPe,byAssets);
  return c>0?c:null;
}

function StockTiles(p){

}

/* ---------- search box (full website only) ---------- */
function LiveSearch(p){
  var s1=useState(''),q=s1[0],setQ=s1[1];
  var s2=useState([]),list=s2[0],setList=s2[1];
  var s3=useState(false),busy=s3[0],setBusy=s3[1];
  var s4=useState(false),done=s4[0],setDone=s4[1];
  var seq=useRef(0),timer=useRef(null);

  useEffect(function(){return function(){if(timer.current){clearTimeout(timer.current);}};},[]);

  function onType(e){
    var v=e.target.value;
    setQ(v);setDone(false);
    if(timer.current){clearTimeout(timer.current);}
    var t=v.trim();
    seq.current++;
    if(t.length<1){setList([]);setBusy(false);return;}
    setBusy(true);
    var my=seq.current;
    timer.current=setTimeout(function(){
      searchLive(t).then(function(r){
        if(my===seq.current){setList(r);setBusy(false);setDone(true);}
      },function(){
        if(my===seq.current){setList([]);setBusy(false);setDone(true);}
      });
    },260);
  }
  function choose(sym){
    seq.current++;
    if(timer.current){clearTimeout(timer.current);}
    setList([]);setQ('');setBusy(false);setDone(false);
    p.onPick(sym);
  }
  function submit(e){
    e.preventDefault();
    var t=q.trim();
    if(!t){return;}
    var up=t.toUpperCase().replace(/\./g,'-');
    var exact=list.filter(function(x){return x.t===up;})[0];
    if(exact){choose(exact.t);}
    else if(!busy&&list.length){choose(list[0].t);}
    else if(/^[A-Z0-9-]{1,10}$/.test(up)){choose(up);}
  }
  var showNone=done&&!busy&&!list.length&&q.trim().length>0;
  return html`<form className="lsearch" onSubmit=${submit} role="search">
    <label htmlFor="ls-q" className="lbl" style=${{marginTop:0}}>חיפוש חברה אמריקאית</label>
    <div className="ls-row">
      <input id="ls-q" type="text" dir="auto" autoComplete="off" autoCapitalize="characters" spellCheck="false" enterKeyHint="search" placeholder="סימול או שם, למשל AAPL או Coca" value=${q} onChange=${onType} disabled=${!!p.busy} />
      <button type="submit" className="btn" disabled=${!!p.busy||!q.trim()}>בדיקה</button>
    </div>
    ${list.length?html`<ul className="ls-list" aria-label="תוצאות חיפוש">
      ${list.map(function(x){
        return html`<li key=${x.t}><button type="button" className="ls-item" onClick=${function(){choose(x.t);}}>
          <b dir="ltr">${x.t}</b><span dir="ltr">${x.n}</span><em dir="ltr">${x.ex||''}</em>
        </button></li>`;
      })}
    </ul>`:null}
    ${busy&&!list.length?html`<p className="note" style=${{marginTop:8}}>מחפשים...</p>`:null}
    ${showNone?html`<p className="note" style=${{marginTop:8}}>לא מצאנו חברה כזו. האתר מכסה חברות שנסחרות בבורסות של ארצות הברית, לא את הבורסה של תל אביב. נסו סימול (למשל KO) או חלק משם החברה באנגלית.</p>`:null}
  </form>`;
}

/* ---------- demo trading account: virtual money, real prices, saved on this device only ---------- */
var DEMO_KEY='masluol-hon-demo-v1';
var DEMO_STARTS=[[5000,'5,000$'],[10000,'10,000$'],[25000,'25,000$'],[100000,'100,000$']];

function r2(v){return Math.round(v*100)/100;}
function r4(v){return Math.round(v*10000)/10000;}
function usd(v,d){return mny(v,d===undefined?2:d,'$');}
function susd(v){
  var a=Math.abs(v);
  return LRM+(r2(v)>0?'+':r2(v)<0?'-':'')+'$'+fx(a,2);
}
function shFmt(v){
  if(typeof v!=='number'||!isFinite(v)){return '—';}
  if(Math.abs(v-Math.round(v))<0.00005){return nf0.format(Math.round(v));}
  return fx(v,4).replace(/0+$/,'');
}
function pad2(n){return n<10?'0'+n:String(n);}
function dStamp(ts){
  var d=new Date(ts);
  return d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function dShort(ts){var d=new Date(ts);return d.getDate()+'.'+(d.getMonth()+1);}

function demoNew(start){
  return {v:1,start:start,cash:start,hold:{},log:[],snap:[{t:Date.now(),v:start}],created:Date.now()};
}
function demoLoad(){
  try{
    var s=localStorage.getItem(DEMO_KEY);
    if(s){
      var d=JSON.parse(s);
      if(d&&d.v===1&&typeof d.cash==='number'&&typeof d.start==='number'&&d.hold&&Array.isArray(d.log)&&Array.isArray(d.snap)){return d;}
    }
  }catch(e){}
  return null;
}
function demoSave(a){
  try{localStorage.setItem(DEMO_KEY,JSON.stringify(a));return true;}catch(e){return false;}
}
function demoClear(){try{localStorage.removeItem(DEMO_KEY);}catch(e){}}

/* totals for an account */
function demoStats(a){
  var val=0,cost=0;
  Object.keys(a.hold).forEach(function(k){
    var x=a.hold[k];
    var px=x.px>0?x.px:(x.sh>0?x.cost/x.sh:0);
    val+=x.sh*px;
    cost+=x.cost;
  });
  var realized=0;
  a.log.forEach(function(l){if(l.side==='sell'&&typeof l.pl==='number'){realized+=l.pl;}});
  var total=a.cash+val;
  return {val:val,cost:cost,total:total,pl:total-a.start,plPct:(total/a.start-1)*100,unreal:val-cost,realized:realized};
}
/* add a point to the value history (replaces the last one when it is less than a minute old) */
function demoSnap(a){
  var st=demoStats(a),now=Date.now();
  var last=a.snap[a.snap.length-1];
  if(last&&a.snap.length>1&&now-last.t<60000){a.snap[a.snap.length-1]={t:now,v:r2(st.total)};}
  else{a.snap.push({t:now,v:r2(st.total)});}
  if(a.snap.length>300){a.snap.splice(1,a.snap.length-300);}
}

/* one price: the live service on the full site, the dated snapshot in the preview */
function demoQuote(sym){
  sym=String(sym||'').trim().toUpperCase().replace(/\./g,'-');
  if(!LIVE_API){
    for(var i=0;i<REAL_COS.length;i++){
      if(REAL_COS[i].tk===sym){return Promise.resolve({ok:true,tk:sym,n:REAL_COS[i].n,price:REAL_COS[i].price,asOf:REAL_COS[i].pd,src:'מחיר סגירה מתאריך '+REAL_COS[i].pd,at:Date.now()});}
    }
    return Promise.resolve({ok:false,msg:'בתצוגה המקדימה אפשר לסחור רק בתשע חברות הדוגמה. באתר המלא אפשר לסחור בכל חברה אמריקאית.'});
  }
  return apiGet('quote',{symbol:sym}).then(function(q){
    if(q&&q.ok&&q.price>0){
      return {ok:true,tk:q.tk||sym,price:q.price,asOf:q.asOf?heIso(q.asOf):'',src:q.source||'',at:Date.now()};
    }
    var code=q&&q.code;
    return {ok:false,msg:code==='noquote'?'מחיר חי אינו מופעל באתר כרגע.':code==='noprice'?'לא מצאנו מחיר לסימול הזה. בדקו שהסימול נכון ושהמניה נסחרת בבורסה אמריקאית.':code==='badsym'?'הסימול אינו תקין. הקלידו סימול אמריקאי, למשל KO.':'שירות המחירים לא ענה. נסו שוב בעוד רגע.'};
  },function(){
    return {ok:false,msg:'לא הצלחנו להתחבר לשירות המחירים. בדקו את החיבור ונסו שוב.'};
  });
}
/* price + company name */
function demoLookup(sym){
  var up=String(sym||'').trim().toUpperCase().replace(/\./g,'-');

    for(var i=0;i<l.length;i++){if(l[i].t===up){return l[i].n;}}

}

    if(!look||!acct){return null;}
    var n=parseFloat(String(qty).replace(',','.'));
    if(!(n>0)){return {empty:true};}
    var px=look.price,held=acct.hold[look.tk];
    var sh=mode==='usd'?Math.floor(n/px*10000)/10000:r4(n);
    if(side==='sell'&&held&&sh>held.sh&&sh-held.sh<0.001){sh=held.sh;}
    if(!(sh>0)){return {err:'הסכום קטן מכדי לקנות אפילו חלק ממניה.'};}
    var total=r2(sh*px);
    if(side==='buy'){
      if(total>acct.cash+0.004){return {err:'אין מספיק מזומן. היתרה היא '+usd(acct.cash)+'.',sh:sh,total:total};}
    }else{
      if(!held){return {err:'אין לכם מניות של החברה הזו.'};}
      if(sh>held.sh+0.00001){return {err:'יש לכם רק '+shFmt(held.sh)+' מניות של החברה הזו.',sh:sh,total:total};}
      if(sh>=held.sh-0.00005){sh=held.sh;total=r2(sh*px);}
    }
    return {sh:sh,total:total};
  }

  function runOrder(){
    var c=plan();
    if(!c||c.empty||c.err||!look){return;}
    if(LIVE_API&&Date.now()-look.at>120000){
      var my=++seq.current;
      setLookBusy(look.tk);
      demoLookup(look.tk).then(function(r){
        if(my!==seq.current){return;}
        setLookBusy(null);
        if(!r.ok){setMsg({tone:'bad',t:r.msg});return;}
        setLook(r);
        setMsg({tone:'info',t:'המחיר התעדכן ל-'+usd(r.price)+'. בדקו את ההזמנה ולחצו שוב לאישור.'});
      });
      return;
    }
    var a=JSON.parse(JSON.stringify(acct));
    var tk=look.tk,pos=a.hold[tk],entry;
    if(side==='buy'){
      a.cash=r2(a.cash-c.total);
      if(pos){pos.sh=r4(pos.sh+c.sh);pos.cost=r2(pos.cost+c.total);pos.px=look.price;pos.asOf=look.asOf;}
      else{a.hold[tk]={n:look.n||tk,sh:c.sh,cost:c.total,px:look.price,asOf:look.asOf};}
      entry={t:Date.now(),side:'buy',tk:tk,n:look.n||tk,sh:c.sh,px:look.price,total:c.total};
      setMsg({tone:'good',t:'בוצעה קנייה: '+shFmt(c.sh)+' מניות '+tk+' ב-'+usd(look.price)+' למניה, בסך '+usd(c.total)+'.'});
    }else{
      var costPart=c.sh>=pos.sh?pos.cost:r2(pos.cost/pos.sh*c.sh);
      var pl=r2(c.total-costPart);
      a.cash=r2(a.cash+c.total);
      pos.sh=r4(pos.sh-c.sh);pos.cost=r2(pos.cost-costPart);pos.px=look.price;pos.asOf=look.asOf;
      if(pos.sh<=0.00005){delete a.hold[tk];}
      entry={t:Date.now(),side:'sell',tk:tk,n:look.n||tk,sh:c.sh,px:look.price,total:c.total,pl:pl};
      setMsg({tone:pl>=0?'good':'bad',t:'בוצעה מכירה: '+shFmt(c.sh)+' מניות '+tk+' ב-'+usd(look.price)+' למניה, בסך '+usd(c.total)+'. '+(pl>=0?'רווח':'הפסד')+' ממומש: '+susd(pl)+'.'});
    }
    a.log.unshift(entry);
    if(a.log.length>200){a.log.length=200;}
    commit(a);
    setQty('');
  }

  function fillMax(){
    if(!look||!acct){return;}
    if(side==='buy'){
      setQty(mode==='usd'?String(Math.floor(acct.cash*100)/100):String(Math.floor(acct.cash/look.price*10000)/10000));
    }else{
      var held=acct.hold[look.tk];
      if(!held){return;}
      setMode('sh');setQty(String(held.sh));
    }
  }

  /* ---- no account yet ---- */
  if(!acct){
    return html`<div className="page"><div className="in">
      <div className="crumbs"><button type="button" onClick=${function(){p.go({v:'home'});}}>דף הבית</button><span>חשבון דמו</span></div>
      <span className="eyebrow">תרגול בלי סיכון</span>
      <h1>חשבון דמו: משקיעים בכסף וירטואלי</h1>
      <p className="lede">מקבלים סכום וירטואלי, קונים ומוכרים מניות אמיתיות במחיר השוק, ורואים כמה הרווחתם או הפסדתם. אין כאן כסף אמיתי ואין סיכון, וזו הדרך הטובה ביותר לתרגל את מה שלמדתם לפני שמשקיעים באמת.</p>
      <div className="dm-start">
        <span className="lbl" style=${{marginTop:0}}>בכמה כסף וירטואלי מתחילים?</span>
        <${Seg} label="סכום פתיחה" value=${startSel} set=${setStartSel} options=${DEMO_STARTS} />
        <div className="cta-row" style=${{marginTop:18}}>
          <button type="button" className="btn" onClick=${openAccount}>פתיחת חשבון דמו</button>
        </div>
      </div>
      <div className="callout info" role="note" style=${{marginTop:24,maxWidth:860}}><b>איך זה עובד</b> ${LIVE_API?'המחיר של כל מניה נמשך משירות מחירים חיצוני ברגע שמחפשים אותה, וקונים ומוכרים במחיר הזה. אפשר לסחור בכל חברה אמריקאית.':'בתצוגה המקדימה זמינות תשע חברות הדוגמה, במחיר הסגירה האחרון שאספנו. באתר המלא אפשר לסחור בכל חברה אמריקאית במחיר חי.'} החשבון נשמר בדפדפן במכשיר הזה בלבד. בלי עמלות, בלי מיסים ובלי פער בין מחיר קנייה למחיר מכירה, ולכן התוצאות טובות יותר מהמציאות.</div>
    </div></div>`;
  }

  /* ---- account ---- */
  var st=demoStats(acct);
  var keys=Object.keys(acct.hold).sort(function(x,y){
    var a=acct.hold[x],b=acct.hold[y];
    return b.sh*(b.px||0)-a.sh*(a.px||0);
  });
  var cp=plan();
  var heldNow=look?acct.hold[look.tk]:null;
  var tone=Math.abs(st.pl)<0.005?'':(st.pl>0?'good':'bad');
  var snaps=acct.snap;
  var xs=snaps.map(function(_,i){return i;});
  var vals=snaps.map(function(x){return x.v;});
  var lo=Math.min.apply(null,vals.concat([acct.start])),hi=Math.max.apply(null,vals.concat([acct.start]));
  var pad=Math.max((hi-lo)*0.15,acct.start*0.01);
  var tight=(hi-lo)+2*pad<6000;

  return html`<div className="page"><div className="in">
    <div className="crumbs"><button type="button" onClick=${function(){p.go({v:'home'});}}>דף הבית</button><span>חשבון דמו</span></div>
    <span className="eyebrow">כסף וירטואלי, מחירים אמיתיים</span>
    <h1>חשבון דמו</h1>

    <div className="stats dm-stats">
      <${Stat} big=${true} label="שווי החשבון" value=${usd(st.total)} sub=${'התחלתם עם '+usd(acct.start,0)} />
      <${Stat} tone=${tone} label="רווח או הפסד כולל" value=${susd(st.pl)} sub=${spct(st.plPct,2)+' מסכום הפתיחה'} />
      <${Stat} label="מזומן פנוי" value=${usd(acct.cash)} />
      <${Stat} label="שווי המניות" value=${usd(st.val)} sub=${keys.length?keys.length+' אחזקות':'אין אחזקות'} />
    </div>
    ${!saved?html`<div className="callout bad" role="alert"><b>החשבון לא נשמר.</b> הדפדפן חוסם שמירה במכשיר, ולכן החשבון יימחק כשתסגרו את הדף.</div>`:null}

    ${snaps.length>=2?html`<div className="dm-chart">
      <h3 className="dm-h">שווי החשבון לאורך זמן</h3>
      <${LineChart} xs=${xs} yMin=${Math.max(0,lo-pad)} yMax=${hi+pad} fmtY=${tight?function(v){return nf0.format(Math.round(v));}:compactNum} left=${tight?58:null} fmtX=${function(i){return dShort(snaps[Math.round(i)]?snaps[Math.round(i)].t:Date.now());}} aria="גרף שווי החשבון"
        lines=${[{values:vals,color:'var(--brand)',width:3,area:true},{values:vals.map(function(){return acct.start;}),color:'var(--muted)',dash:'5 4',width:2}]}
        readout=${function(i){var s=snaps[i];return [{label:'תאריך',value:dStamp(s.t)},{label:'שווי',value:usd(s.v),color:'var(--brand)'},{label:'לעומת הפתיחה',value:susd(s.v-acct.start)}];}} />
      <div className="legend"><span><i></i>שווי החשבון</span><span><i className="dash"></i>סכום הפתיחה</span><span>נקודה חדשה נוספת בכל פעולה וכשמרעננים מחירים</span></div>
    </div>`:null}

    <section className="dm-trade" ref=${tradeRef} style=${{scrollMarginTop:80}}>
      <h2 className="dm-h2">קנייה ומכירה</h2>
      ${LIVE_API?html`<${LiveSearch} onPick=${function(sym){lookup(sym);}} busy=${!!lookBusy} />`:null}
      <span className="lbl">${LIVE_API?'או בחרו אחת מחברות הדוגמה':'בחרו חברה'}</span>
      <div className="dm-chips" role="group" aria-label="חברות לדוגמה">
        ${REAL_COS.map(function(c){
          return html`<button key=${c.id} type="button" className=${'dm-chip'+(look&&look.tk===c.tk?' on':'')} disabled=${!!lookBusy} onClick=${function(){lookup(c.tk);}}><b dir="ltr">${c.tk}</b><span>${c.n}</span></button>`;
        })}
      </div>
      ${lookBusy?html`<div className="callout info" role="status" aria-live="polite"><b>מביאים מחיר ל-${html`<bdi dir="ltr">${lookBusy}</bdi>`}.</b></div>`:null}
      ${lookErr?html`<div className="callout bad" role="alert"><b>לא הצלחנו.</b> ${lookErr}</div>`:null}

      ${look?html`<div className="dm-order">
        <div className="dm-co">
          <div><b className="dm-name" dir="auto">${look.n}</b><span className="tkr" dir="ltr">${look.tk}</span></div>
          <div className="dm-px"><strong>${usd(look.price)}</strong><small>${look.asOf?'נכון ל-'+look.asOf:''}${look.src&&LIVE_API?' · '+look.src:''}</small></div>
        </div>
        ${heldNow?html`<p className="note" style=${{margin:'6px 0 0'}}>יש לכם ${shFmt(heldNow.sh)} מניות, בעלות ממוצעת של ${usd(heldNow.cost/heldNow.sh)} למניה.</p>`:null}
        <div className="rowseg" style=${{marginTop:14}}>
          <${Seg} label="סוג פעולה" value=${side} set=${function(v){setSide(v);setMsg(null);setQty('');}} options=${[['buy','קנייה'],['sell','מכירה']]} />
          <${Seg} label="איך מזינים כמות" value=${mode} set=${function(v){setMode(v);setQty('');}} options=${[['usd','לפי סכום ב-$'],['sh','לפי מספר מניות']]} />
        </div>
        <label htmlFor="dm-q" className="lbl">${mode==='usd'?'סכום ב-דולרים':'מספר מניות'}</label>
        <div className="ls-row">
          <input id="dm-q" type="text" inputMode="decimal" autoComplete="off" dir="ltr" placeholder=${mode==='usd'?'למשל 1000':'למשל 10'} value=${qty} onChange=${function(e){setQty(e.target.value);setMsg(null);}} />
          <button type="button" className="btn ghost" onClick=${fillMax}>${side==='buy'?'כל המזומן':'מכירת הכול'}</button>
        </div>
        ${cp&&!cp.empty?html`<div className=${'dm-sum'+(cp.err?' bad':'')} role="status" aria-live="polite">
          ${cp.err?html`<b>${cp.err}</b>`:html`<span>${side==='buy'?'תקנו':'תמכרו'} <b>${shFmt(cp.sh)}</b> מניות ב-<b>${usd(look.price)}</b> למניה: <b>${usd(cp.total)}</b>. ${side==='buy'?'המזומן שיישאר: ':'המזומן אחרי המכירה: '}<b>${usd(side==='buy'?acct.cash-cp.total:acct.cash+cp.total)}</b>.</span>`}
        </div>`:null}
        <div className="actions" style=${{marginTop:12}}>
          <button type="button" className=${'btn'+(side==='sell'?' sell':'')} disabled=${!cp||!!cp.empty||!!cp.err||!!lookBusy} onClick=${runOrder}>${side==='buy'?'אישור קנייה':'אישור מכירה'}</button>
          ${LIVE_API||realById(look.tk)?html`<button type="button" className="btn ghost" onClick=${function(){p.go({v:'stock',id:look.tk});}}>בדיקה לפי גרהם</button>`:null}
        </div>
      </div>`:null}
      ${msg?html`<div className=${'callout '+msg.tone} role="status" aria-live="polite" style=${{marginTop:14}}>${msg.t}</div>`:null}
    </section>

    <section className="dm-pos">
      <div className="dm-posh">
        <h2 className="dm-h2" style=${{margin:0}}>האחזקות שלכם</h2>
        ${LIVE_API&&keys.length?html`<button type="button" className="btn ghost sm" disabled=${refBusy} onClick=${refreshAll}>${refBusy?'מרעננים...':'רענון מחירים'}</button>`:null}
      </div>
      ${refAt?html`<p className="note" style=${{margin:'6px 0 0'}}>${refFail?'לא כל המחירים התעדכנו ('+refFail+' נכשלו). ':''}עודכן ב-${dStamp(refAt).split(' ')[1]}.</p>`:null}
      ${keys.length?html`<div className="dm-list">${keys.map(function(k){
        var x=acct.hold[k];
        var px=x.px>0?x.px:x.cost/x.sh;
        var val=x.sh*px,pl=val-x.cost,pp=x.cost>0?pl/x.cost*100:0;
        var tn=Math.abs(pl)<0.005?'':(pl>0?'good':'bad');
        return html`<article key=${k} className="dm-pos-card">
          <div className="dm-pc-top">
            <div><b dir="auto">${x.n}</b><span className="tkr" dir="ltr">${k}</span></div>
            <strong className=${'dm-pl '+tn}>${susd(pl)} <small>${spct(pp,1)}</small></strong>
          </div>
          <dl className="dm-grid">
            <div><dt>כמות</dt><dd>${shFmt(x.sh)}</dd></div>
            <div><dt>עלות ממוצעת</dt><dd>${usd(x.cost/x.sh)}</dd></div>
            <div><dt>מחיר נוכחי</dt><dd>${usd(px)}</dd></div>
            <div><dt>שווי</dt><dd>${usd(val)}</dd></div>
          </dl>
          <div className="actions">
            <button type="button" className="btn sm" onClick=${function(){lookup(k,'buy');}}>קנייה נוספת</button>
            <button type="button" className="btn ghost sm" onClick=${function(){lookup(k,'sell');}}>מכירה</button>
            ${LIVE_API||realById(k)?html`<button type="button" className="btn ghost sm" onClick=${function(){p.go({v:'stock',id:k});}}>בדיקת גרהם</button>`:null}
          </div>
        </article>`;
      })}</div>`:html`<p className="note" style=${{marginTop:10}}>עדיין אין אחזקות. בחרו חברה למעלה וקנו את המניה הראשונה.</p>`}
      ${st.realized!==0?html`<p className="note" style=${{marginTop:12}}>רווח או הפסד ממומש ממכירות עד היום: <b>${susd(st.realized)}</b>. רווח או הפסד על הנייר באחזקות הנוכחיות: <b>${susd(st.unreal)}</b>.</p>`:null}
    </section>

    ${acct.log.length?html`<details className="adv dm-log"><summary>היסטוריית פעולות (${acct.log.length})</summary>
      <div className="tblwrap"><table className="tbl">
        <thead><tr><th>תאריך</th><th>פעולה</th><th>מניה</th><th>כמות</th><th>מחיר</th><th>סכום</th><th>רווח ממומש</th></tr></thead>
        <tbody>${acct.log.slice(0,60).map(function(l,i){
          return html`<tr key=${i}><td>${dStamp(l.t)}</td><td>${l.side==='buy'?'קנייה':'מכירה'}</td><td dir="ltr">${l.tk}</td><td>${shFmt(l.sh)}</td><td>${usd(l.px)}</td><td>${usd(l.total)}</td><td>${typeof l.pl==='number'?susd(l.pl):'—'}</td></tr>`;
        })}</tbody>
      </table></div>
    </details>`:null}

    <div className="callout info" role="note" style=${{marginTop:26,maxWidth:860}}><b>מה לומדים מהחשבון הזה</b> גרהם הזהיר שהשוק מתנודד בין התלהבות לפחד, ושמחיר מניה ביום או בשבוע אומר מעט על שווי החברה. לכן שימו לב אם הרווח או ההפסד שלכם מגיע מהשוק ביום אחד, או מחברה חזקה שקניתם במחיר סביר. לפני כל קנייה נסו לרוץ על ${LIVE_API?'בדיקת גרהם':'הבדיקה האוטומטית'} של החברה, ובדקו אחרי כמה חודשים אם היא עזרה.</div>
    <div className="callout info" role="note" style=${{marginTop:14,maxWidth:860}}><b>הסתייגות</b> זו הדמיה לימודית בכסף וירטואלי. אין בה עמלות, מיסים או פער בין קנייה למכירה, והמחירים עלולים להיות מעוכבים או שגויים. הצלחה בדמו אינה מבטיחה הצלחה בכסף אמיתי, ואינה המלצה לקנות או למכור.</div>

    <div className="dm-reset">
      ${askReset?html`<div className="callout bad" role="alert"><b>למחוק את החשבון ולהתחיל מחדש?</b> כל האחזקות וההיסטוריה יימחקו. אי אפשר לשחזר.
        <div className="actions" style=${{marginTop:10}}>
          <button type="button" className="btn sell" onClick=${resetAccount}>כן, למחוק ולהתחיל מחדש</button>
          <button type="button" className="btn ghost" onClick=${function(){setAskReset(false);}}>ביטול</button>
        </div></div>`
        :html`<button type="button" className="btn ghost sm" onClick=${function(){setAskReset(true);}}>איפוס החשבון והתחלה מחדש</button>`}
    </div>
  </div></div>`;
}

/* ---------- quiz ---------- */
function Quiz(p){
  var qs=p.questions,need=p.need;
  var st=useState({i:0,pick:null,score:0,fin:false,res:[]}),s=st[0],setS=st[1];
  function choose(k){
    if(s.pick!==null){return;}
    var ok=k===qs[s.i].a;
    setS({i:s.i,pick:k,score:s.score+(ok?1:0),fin:false,res:s.res.concat([ok])});
  }
  function next(){
    if(s.i+1<qs.length){setS({i:s.i+1,pick:null,score:s.score,fin:false,res:s.res});}
    else{setS({i:s.i,pick:s.pick,score:s.score,fin:true,res:s.res});p.onFinish(s.score);}
  }
  function retry(){setS({i:0,pick:null,score:0,fin:false,res:[]});}
  var dots=html`<div className="dots" aria-hidden="true">${qs.map(function(q,j){
    var c=s.res[j]===true?'ok':s.res[j]===false?'bad':(j===s.i&&!s.fin)?'cur':'';
    return html`<i key=${j} className=${c}></i>`;
  })}</div>`;
  if(s.fin){
    var passed=s.score>=need;
    var msg=s.score===qs.length?'מצוין, הכל נכון.':passed?'עברתם. שווה לחזור על השאלות שהחמצתם.':'כדי לעבור צריך לפחות '+need+' תשובות נכונות. חזרו על החומר ונסו שוב.';
    return html`<div className="quiz">
      ${dots}
      <div className="qn">סיכום</div>
      <div className="score">${s.score} / ${qs.length}</div>
      <p>${msg}</p>
      <div className="actions">
        ${passed&&p.onNext?html`<button type="button" className="btn" onClick=${p.onNext}>${p.nextLabel||'להמשך'}</button>`:null}
        <button type="button" className=${passed?'btn ghost':'btn'} onClick=${retry}>לנסות שוב</button>
        <button type="button" className="btn ghost" onClick=${p.onBack}>חזרה למסלול</button>
      </div>
    </div>`;
  }
  var q=qs[s.i];
  return html`<div className="quiz">
    ${dots}
    <div className="qn">שאלה ${s.i+1} מתוך ${qs.length}</div>
    <h3>${q.q}</h3>
    <div className="opts">
      ${q.o.map(function(t,k){
        var cls='opt',mk='';
        if(s.pick!==null){
          if(k===q.a){cls+=' ok';mk='✓';}
          else if(k===s.pick){cls+=' bad';mk='✕';}
        }
        return html`<button key=${k} type="button" className=${cls} disabled=${s.pick!==null} onClick=${function(){choose(k);}}><span className="mk" aria-hidden="true">${mk}</span><span>${t}</span></button>`;
      })}
    </div>
    ${s.pick!==null?html`<div className="why" role="status"><b>${s.pick===q.a?'נכון':'לא מדויק'}</b>${q.e}</div>`:null}
    ${s.pick!==null?html`<div className="actions"><button type="button" className="btn" onClick=${next}>${s.i+1<qs.length?'לשאלה הבאה':'לסיכום'}</button></div>`:null}
  </div>`;
}

function Lesson(p){

  var sa=useState('sec-0'),active=sa[0],setActive=sa[1];
  var prev=idx>0?LESSONS[idx-1]:null,next=idx<LESSONS.length-1?LESSONS[idx+1]:null;
  function jump(id){var el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}}
  function startQuiz(){setReady(true);setTimeout(function(){jump('quiz-anchor');},60);}
  var tools=L.tools||[];
  var stepInfo=stepsOfLesson(L.id);
  var toc=L.s.map(function(sec,k){return {id:'sec-'+k,t:sec.h};})
    .concat(tools.map(function(id){return {id:'tool-'+id,t:'תרגול: '+TOOLS[id].t,tool:true};}))
    .concat([{id:'recap',t:'סיכום וחידון'}]);
  useEffect(function(){
    if(typeof IntersectionObserver==='undefined'){return;}
    var els=toc.map(function(x){return document.getElementById(x.id);}).filter(Boolean);
    var io=new IntersectionObserver(function(entries){
      entries.forEach(function(e){if(e.isIntersecting){setActive(e.target.id);}});
    },{rootMargin:'-90px 0px -62% 0px',threshold:0});
    els.forEach(function(e){io.observe(e);});
    return function(){io.disconnect();};
  },[L.id]);
  return html`<article className="page"><div className="in">
    <div className="crumbs"><button type="button" onClick=${function(){p.go({v:'course'});}}>הקורס</button><span>${PARTS[L.part].k}: ${PARTS[L.part].t}</span></div>
    <h1>${L.t}</h1>
    <div className="meta">
      <span className="pill">שיעור ${idx+1} מתוך ${LESSONS.length}</span>
      <span className="pill">${L.min} דקות קריאה</span>

/* ---------- route (curriculum list) ---------- */
function Route(p){
  var items=[];
  LESSONS.forEach(function(l,k){
    if(k===0||LESSONS[k-1].part!==l.part){
      var P=PARTS[l.part];
      var inPart=LESSONS.filter(function(x){return x.part===l.part;});
      var dn=inPart.filter(function(x){return p.prog[x.id]&&p.prog[x.id].done;}).length;
      items.push(html`<li key=${'p'+l.part} className="part"><div><b>${P.k}: ${P.t}</b><small>${P.d}</small></div><span className="pc" aria-label=${dn+' מתוך '+inPart.length+' שיעורים בחלק'}>${dn}/${inPart.length}</span></li>`);
    }
    var st=p.prog[l.id],done=st&&st.done,isNext=p.nextId===l.id;
    var nt=(l.tools||[]).length;
    items.push(html`<li key=${l.id} className=${'rt'+(done?' done':'')}>
      <span className=${'node'+(done?' done':'')+(isNext?' next':'')} aria-hidden="true">${done?'✓':k+1}</span>
      <button type="button" className="lc" onClick=${function(){p.go({v:'lesson',id:l.id});}}>
        <h3>${l.t}</h3>
        <p>${l.sum}</p>
        <div className="meta">
          <span className="pill">${l.min} דקות</span>
          ${nt?html`<span className="pill tool">${nt>1?nt+' כלים':'כלי'}</span>`:null}
          ${done?html`<span className="pill ok">הושלם ${st.best}/${l.quiz.length}</span>`:(isNext?html`<span className="pill next">הבא בתור</span>`:null)}
        </div>
      </button>
    </li>`);
  });
  var ex=p.prog.exam,exDone=!!(ex&&ex.done&&ex.n===EXAM.length);
  items.push(html`<li key="pe" className="part"><div><b>סיום</b><small>מבחן אחד על כל הקורס</small></div></li>`);
  items.push(html`<li key="exam" className=${'rt'+(exDone?' done':'')}>
    <span className=${'node'+(exDone?' done':'')+(p.nextId==='exam'?' next':'')} aria-hidden="true">${exDone?'✓':'★'}</span>
    <button type="button" className="lc" onClick=${function(){p.go({v:'exam'});}}>
      <h3>מבחן סיום</h3>
      <p>${EXAM.length} שאלות על כל הקורס, כולל חישובים. אחרי המעבר מקבלים רשימת צעדים להתחלה.</p>
      <div className="meta"><span className="pill">${EXAM.length} שאלות</span>${exDone?html`<span className="pill ok">עברתם ${ex.best}/${ex.n}</span>`:null}</div>
    </button>
  </li>`);
  return html`<ol className="route">${items}</ol>`;
}

      </div>
    </div></section>
  </div>`;
}

    <span className="eyebrow">הקורס</span>
    <h1>המסלול שלכם</h1>
    <div className="split" style=${{marginTop:20}}>
      <${Route} prog=${p.prog} nextId=${p.nextId} go=${p.go} />
      <aside className="side">
        <div className="prog-card">
          <b>${p.done}/${LESSONS.length}</b>
          <div style=${{flex:1,minWidth:180}}><div className="bar" role="progressbar" aria-valuemin=${0} aria-valuemax=${LESSONS.length} aria-valuenow=${p.done}><i style=${{width:pctDone+'%'}}></i></div><small style=${{color:'var(--muted)'}}>שיעורים שהושלמו</small></div>
          <button type="button" className="btn sm" onClick=${function(){p.go(nextL?{v:'lesson',id:nextL.id}:{v:'exam'});}}>${nextL?(p.done>0?'המשיכו: '+nextL.t:'התחילו בשיעור הראשון'):'למבחן הסיום'}</button>

}

    <div className="wzban">
      <div><b>בודקים מניה? התחילו באשף</b><span>הוא מוביל חברה אחת דרך הצעדים של המדריך, וכל כלי כאן משמש כשרוצים להעמיק בצעד מסוים.</span></div>

    <span className="eyebrow">${T.k==='sim'?'סימולטור':'כלי לתרגול'}</span>
    <h1>${T.t}</h1>

/* ---------- shell ---------- */
function Header(p){
  var nav=[['find','איך מוצאים מניה טובה','מניה טובה'],['stock','בדיקת מניה אמיתית','מניה אמיתית'],['demo','חשבון דמו','דמו'],['course','הקורס'],['sims','סימולטורים וכלים','כלים'],['exam','מבחן סיום','מבחן']];
  var cur=p.view.v==='lesson'?'course':p.view.v==='sim'?'sims':p.view.v==='check'?'find':p.view.v==='numbers'?'find':p.view.v;
  return html`<header className="top"><div className="in">
    <button type="button" className="brand" onClick=${function(){p.go({v:'home'});}}><${Logo} /><span>מסלול ההון</span></button>
    <nav className="nav" aria-label="ניווט ראשי">
      ${nav.map(function(n){return html`<button key=${n[0]} type="button" aria-current=${cur===n[0]?'page':null} onClick=${function(){p.go({v:n[0]});}}>${n[2]?html`<${React.Fragment}><span className="long">${n[1]}</span><span className="short">${n[2]}</span><//>`:n[1]}</button>`;})}
    </nav>
    <div className="who"><span>${p.done} מתוך ${LESSONS.length} שיעורים</span><${Ring} done=${p.done} total=${LESSONS.length} /></div>
    ${p.read>0?html`<div className="readbar" style=${{width:p.read+'%'}}></div>`:null}
  </div></header>`;
}

function SiteFooter(){
  return html`<footer className="foot"><div className="in">
    <div className="cols">
      <div><h4>הסתייגות חשובה</h4><p>התוכן באתר לימודי בלבד, ואינו ייעוץ השקעות, שיווק השקעות או המלצה לפעולה. כל השקעה כרוכה בסיכון, כולל הפסד הקרן, ותשואות עבר אינן מבטיחות תשואות עתידיות. ייעוץ אישי בישראל ניתן על ידי בעלי רישיון בלבד.</p></div>
      <div><h4>מספרים והדגמות</h4><p>הסימולטורים והמחשבונים הם הדגמות מתמטיות בהנחות לדוגמה ואינם תחזית. התקרות, שיעורי המס והתנאים (נכון ל-2026) משתנים, ויש לבדוק אותם בגורמים הרשמיים לפני החלטה. החברות לדוגמה באתר (א׳, ב׳ וג׳) דמיוניות. ${LIVE_API?'נתוני חברות שנבדקות בחיפוש נמשכים מהדוחות שהוגשו ל-SEC ברגע הבדיקה, ונתוני תשע חברות הדוגמה הם צילום מצב מתאריך שמצוין ליד כל חברה. שניהם, וכן מחירי מניות אם הם מוצגים, עלולים לכלול טעויות או עיכוב, ולכן יש לאמת אותם מול הדוחות הרשמיים.':'נתוני המניות האמיתיות הם צילום מצב מתאריך שמצוין ליד כל חברה, נאספו מאתרי נתונים ציבוריים ועלולים לכלול טעויות, ולכן יש לאמת אותם מול הדוחות הרשמיים.'}</p></div>
      <div><h4>על התוכן</h4><p>השיעורים הם סיכום במילים שלנו של הרעיונות המרכזיים בספר המשקיע הנבון מאת בנג'מין גרהם, ואינם מחליפים את הספר. האתר עצמאי ואינו קשור לגרהם, לעזבונו או למו"לי הספר.</p></div>
    </div>
    <div className="fine">מסלול ההון · קורס השקעות לימודי בעברית</div>
  </div></footer>`;
}

function parseView(tok){
  if(!tok||tok==='home'){return {v:'home'};}
  if(tok==='course'||tok==='sims'||tok==='exam'||tok==='numbers'||tok==='find'||tok==='check'||tok==='stock'||tok==='demo'){return {v:tok};}
  if(tok.indexOf('stock-')===0){
    var rid=tok.slice(6).toUpperCase();
    if(realById(rid)||(LIVE_API&&/^[A-Z0-9-]{1,10}$/.test(rid))){return {v:'stock',id:rid};}
    return {v:'stock'};
  }
  if(tok.indexOf('lesson-')===0){
    var id=tok.slice(7);
    if(LESSONS.some(function(l){return l.id===id;})){return {v:'lesson',id:id};}
  }
  if(tok.indexOf('sim-')===0){
    var sid=tok.slice(4);
    if(TOOLS[sid]){return {v:'sim',id:sid};}
  }
  return {v:'home'};
}

function App(){
  var s1=useState(function(){return parseView(readHash());}),view=s1[0],setView=s1[1];
  var s2=useState(loadProg),prog=s2[0],setProg=s2[1];
  var s3=useState(0),read=s3[0],setRead=s3[1];
  var first=useRef(true);
  var doneCount=LESSONS.filter(function(l){return prog[l.id]&&prog[l.id].done;}).length;
  var nextLesson=LESSONS.filter(function(l){return !(prog[l.id]&&prog[l.id].done);})[0];
  var examDone=!!(prog.exam&&prog.exam.done&&prog.exam.n===EXAM.length);
  var nextId=nextLesson?nextLesson.id:(examDone?null:'exam');
  function go(v){
    setView(v);
    setRead(0);
    try{window.scrollTo({top:0,left:0,behavior:'instant'});}catch(e){try{window.scrollTo(0,0);}catch(e2){}}
  }
  function finish(id,need,score,n){
    var old=prog[id]||{best:0,done:false};
    if(n&&old.n!==n){old={best:0,done:false};}
    var np=Object.assign({},prog);
    np[id]={best:Math.max(old.best||0,score),done:old.done||score>=need};
    if(n){np[id].n=n;}
    setProg(np);saveProg(np);
  }
  var vkey=view.v+(view.id||'');
  useEffect(function(){
    if(first.current){first.current=false;return;}
    var el=document.getElementById('main');
    if(el){el.focus({preventScroll:true});}
  },[vkey]);
  useEffect(function(){
    if(view.v!=='lesson'){setRead(0);return;}
    var tick=false;
    function onScroll(){
      if(tick){return;}
      tick=true;
      window.requestAnimationFrame(function(){
        tick=false;
        var doc=document.documentElement;
        var max=doc.scrollHeight-window.innerHeight;
        setRead(max>0?clamp(window.scrollY/max*100,0,100):0);
      });
    }
    window.addEventListener('scroll',onScroll,{passive:true});
    onScroll();
    return function(){window.removeEventListener('scroll',onScroll);};
  },[vkey]);

  var body;
  if(view.v==='lesson'){
    var idx=LESSONS.map(function(l){return l.id;}).indexOf(view.id);
    var L=LESSONS[idx];
    body=html`<${Lesson} key=${L.id} lesson=${L} idx=${idx} go=${go} onFinish=${function(sc){finish(L.id,needFor(L.quiz.length),sc);}} />`;
  }else if(view.v==='exam'){
    body=html`<${Exam} go=${go} passed=${examDone} onFinish=${function(sc){finish('exam',needFor(EXAM.length),sc,EXAM.length);}} />`;
  }else if(view.v==='course'){
    body=html`<${Course} go=${go} prog=${prog} done=${doneCount} nextId=${nextId} />`;
  }else if(view.v==='find'){
    body=html`<${Finder} key=${'f'+(view.step||0)} step=${view.step} go=${go} />`;
  }else if(view.v==='check'){
    body=html`<${Wizard} key=${'w'+(view.at||0)+(view.pre||'')} at=${view.at} pre=${view.pre} price=${view.price} go=${go} />`;
  }else if(view.v==='stock'){
    body=html`<${StockCheck} key=${'s'+(view.id||'')} id=${view.id} go=${go} />`;
  }else if(view.v==='demo'){
    body=html`<${Demo} go=${go} />`;
  }else if(view.v==='numbers'){
    body=html`<${NumbersView} go=${go} />`;
  }else if(view.v==='sims'){
    body=html`<${SimsHub} go=${go} />`;
  }else if(view.v==='sim'){
    body=html`<${SimView} key=${view.id} id=${view.id} go=${go} />`;
  }else{
    body=html`<${Home} go=${go} prog=${prog} done=${doneCount} nextId=${nextId} />`;
  }
  return html`<div>
    <a className="skip" href="#main" onClick=${function(e){e.preventDefault();var el=document.getElementById('main');if(el){el.focus();}}}>דלגו לתוכן</a>
    <${Header} view=${view} go=${go} done=${doneCount} read=${read} />
    <main id="main" tabIndex="-1">${body}</main>
    <${SiteFooter} />
  </div>`;
}

/* ---------- safety net: a friendly message instead of a blank page on an unexpected error ---------- */
class Boundary extends React.Component{
  constructor(props){super(props);this.state={err:false};}
  static getDerivedStateFromError(){return {err:true};}
  componentDidCatch(e){try{console.error(e);}catch(x){}}
  render(){
    if(this.state.err){
      return html`<div className="page"><div className="in">
        <h1>משהו השתבש</h1>
        <p className="lede">אירעה שגיאה בטעינת העמוד. אפשר לחזור לדף הבית ולנסות שוב.</p>
        <button type="button" className="btn" onClick=${function(){try{window.location.hash='';window.location.reload();}catch(e){}}}>לדף הבית</button>
      </div></div>`;
    }
    return this.props.children;
  }
}


ReactDOM.createRoot(document.getElementById('root')).render(h(Boundary,null,h(App)));
})();
</script>
